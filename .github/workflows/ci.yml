name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://noom:noom@localhost:5434/noom
  AUTH_SECRET: ci-only-secret-do-not-use-in-production
  AUTH_URL: http://localhost:3000

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noom
          POSTGRES_USER: noom
          POSTGRES_PASSWORD: noom
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U noom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Start app for Lighthouse
        if: ${{ success() }}
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/en >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "App did not become ready for Lighthouse" >&2
          exit 1

      - name: Lighthouse budget
        if: ${{ success() }}
        continue-on-error: true
        run: pnpm lighthouse:ci
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
